# Tag-triggered release pipeline for the desktop app: full proof chain
# (lint, typecheck, unit suites, renderer e2e) -> build -> packaged-runtime
# smoke on the unpacked runtime -> publish NSIS + portable artifacts to the tag's
# GitHub Release. Least privilege: GITHUB_TOKEN only, contents: write only.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test
        run: npm run lint && npm run typecheck && npm run test

      # The renderer e2e serves the built bundle from dist/renderer/browser
      # (scripts/serve-renderer.mjs), so the desktop build must exist before
      # Chromium runs against it.
      - name: Build desktop
        run: npm run build -w @opentimbre/desktop

      - name: Renderer e2e
        run: npx playwright install chromium && npm run test:e2e -w @opentimbre/desktop

      - name: Package NSIS + portable
        run: npx electron-builder --win --publish never
        working-directory: packages/desktop

      # TEMPORARY diagnostic — remove once root-caused: the smoke showed zero
      # BrowserWindows with no captured stderr; this runs the packaged main
      # directly and prints its stdout/stderr to surface where boot stops
      # before openWindow().
      - name: Boot diagnostics (temporary)
        working-directory: packages/desktop
        run: |
          $exe = Resolve-Path "release/win-unpacked/OpenTimbre.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--enable-logging=stderr","--disable-gpu","--no-sandbox" -PassThru -RedirectStandardError "$env:RUNNER_TEMP/app-stderr.txt" -RedirectStandardOutput "$env:RUNNER_TEMP/app-stdout.txt"
          Start-Sleep -Seconds 25
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          "--- stdout ---"
          Get-Content "$env:RUNNER_TEMP/app-stdout.txt" -ErrorAction SilentlyContinue
          "--- stderr ---"
          Get-Content "$env:RUNNER_TEMP/app-stderr.txt" -ErrorAction SilentlyContinue
        continue-on-error: true

      - name: Packaged smoke on the unpacked runtime
        run: npm run test:packaged -w @opentimbre/desktop

      # Republishes over the tag's release; the token is scoped to this step.
      - name: Publish artifacts
        run: npx electron-builder --win --publish always
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
