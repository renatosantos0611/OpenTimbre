# Tag-triggered release pipeline for the desktop app: full proof chain
# (lint, typecheck, unit suites, renderer e2e) -> build -> packaged-runtime
# smoke on the unpacked runtime -> publish NSIS + portable artifacts to the tag's
# GitHub Release. Least privilege: GITHUB_TOKEN only, contents: write only.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The desktop unit suite (`test:main`) asserts that the bundled prompts
      # sit where main.js resolves them, so the desktop build (which copies the
      # prompts into dist/) must exist before `npm run test` runs.
      - name: Build desktop
        run: npm run build -w @opentimbre/desktop

      - name: Test
        run: npm run test

      - name: Renderer e2e
        run: npx playwright install chromium && npm run test:e2e -w @opentimbre/desktop

      - name: Package NSIS + portable
        run: npx electron-builder --win --publish never
        working-directory: packages/desktop

      - name: Packaged smoke on the unpacked runtime
        run: npm run test:packaged -w @opentimbre/desktop

      # Republishes over the tag's release; the token is scoped to this step.
      - name: Publish artifacts
        run: npx electron-builder --win --publish always
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
